<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Luffy Store — Admin</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="admin-body">

  <!-- SIDEBAR -->

  <aside class="admin-sidebar">

    <div class="admin-sidebar-logo">
      LUFFY<span>STORE</span>
    </div>

    <div class="admin-menu-label">
      MANAGEMENT
    </div>

    <a href="admin-dashboard.html" class="admin-menu active">
      <span>▣</span>
      Products
    </a>

    <a href="#" class="admin-menu disabled">
      <span>▤</span>
      Orders
      <small>SOON</small>
    </a>

    <a href="#" class="admin-menu disabled">
      <span>◉</span>
      Customers
      <small>SOON</small>
    </a>

    <div class="admin-menu-label">
      STORE
    </div>

    <a href="/" class="admin-menu">
      <span>↗</span>
      View Store
    </a>

  </aside>


  <!-- MAIN -->

  <main class="admin-main">

    <!-- TOPBAR -->

    <header class="admin-topbar">

      <div>
        <div class="admin-page-label">
          ADMIN PANEL
        </div>

        <h1>Dashboard</h1>
      </div>

      <div class="admin-user">

        <div class="admin-avatar">
          A
        </div>

        <div class="admin-user-info">
          <strong>Administrator</strong>
          <span id="adminEmail">Loading...</span>
        </div>

        <button id="logoutBtn">
          Logout
        </button>

      </div>

    </header>


    <!-- STATS -->

    <section class="admin-stats">

      <div class="stat-card">

        <div class="stat-icon">
          📦
        </div>

        <div>
          <span>Total Products</span>
          <strong id="totalProducts">
            —
          </strong>
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon green">
          ✓
        </div>

        <div>
          <span>Available</span>
          <strong id="availableProducts">
            —
          </strong>
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon red">
          ×
        </div>

        <div>
          <span>Sold</span>
          <strong id="soldProducts">
            —
          </strong>
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon purple">
          RM
        </div>

        <div>
          <span>Store Value</span>
          <strong id="storeValue">
            —
          </strong>
        </div>

      </div>

    </section>


    <!-- PRODUCTS HEADER -->

    <section class="products-panel">

      <div class="products-panel-header">

        <div>
          <h2>Products</h2>

          <p>
            Manage your store inventory.
          </p>
        </div>

        <button
          id="addProductBtn"
          class="add-product-btn"
        >
          + Add Product
        </button>

      </div>


      <div
        id="adminMessage"
        class="admin-message"
      ></div>


      <!-- PRODUCT GRID -->

      <div
        id="productsAdminGrid"
        class="admin-products-grid"
      >

        <div class="empty">
          <h3>Loading...</h3>
          <p>Loading products...</p>
        </div>

      </div>

    </section>

  </main>


  <!-- ADD / EDIT MODAL -->

  <div
    id="productModal"
    class="modal"
  >

    <div class="modal-box">

      <div class="modal-header">

        <div>
          <div class="admin-page-label">
            PRODUCT MANAGEMENT
          </div>

          <h2 id="modalTitle">
            Add Product
          </h2>
        </div>

        <button
          id="closeModalBtn"
          class="close-modal"
        >
          ×
        </button>

      </div>


      <form id="productForm">

        <input
          type="hidden"
          id="productId"
        >


        <label>
          Product Name
        </label>

        <input
          type="text"
          id="productName"
          placeholder="ML Account Mythic"
          required
        >


        <label>
          Category
        </label>

        <select
          id="productCategory"
          required
        >

          <option value="ml">
            ML Account
          </option>

          <option value="efootball">
            eFootball
          </option>

          <option value="apk">
            APK
          </option>

          <option value="web">
            Web Building
          </option>

          <option value="other">
            Other
          </option>

        </select>


        <label>
          Description
        </label>

        <textarea
          id="productDescription"
          placeholder="Product description..."
        ></textarea>


        <label>
          Price (RM)
        </label>

        <input
          type="number"
          id="productPrice"
          min="0"
          step="0.01"
          placeholder="25.00"
          required
        >


        <label>
          Image URL
        </label>

        <input
          type="url"
          id="productImage"
          placeholder="https://..."
          required
        >


        <label>
          Status
        </label>

        <select
          id="productStatus"
          required
        >

          <option value="available">
            Available
          </option>

          <option value="sold">
            Sold
          </option>

          <option value="hidden">
            Hidden
          </option>

        </select>


        <button
          type="submit"
          id="saveProductBtn"
          class="save-product-btn"
        >
          Save Product
        </button>

      </form>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

  <script src="admin-dashboard.js"></script>

</body>
</html>
